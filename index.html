<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sofá AR Teste</title>
</head>

<body style="margin:0; overflow:hidden;">

<div style="position:absolute;top:10px;left:10px;background:white;padding:10px;z-index:10;">
  Largura: <span id="w">0</span> cm<br>
  Altura: <span id="h">0</span> cm<br>
  Profundidade: <span id="d">0</span> cm
</div>

<button onclick="scaleUp()" style="position:absolute;bottom:20px;left:40%;z-index:10;">+</button>
<button onclick="scaleDown()" style="position:absolute;bottom:20px;left:50%;z-index:10;">-</button>

<!-- THREE (VERSÃO GLOBAL) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>

<!-- LOADER COMPATÍVEL -->

<!-- SEU SCRIPT -->
<script src="main.js"></script>

</body>
</html>
